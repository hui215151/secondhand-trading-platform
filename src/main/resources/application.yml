server:
  port: ${SERVER_PORT:8081}
  servlet:
    encoding:
      charset: UTF-8
      force: true
      force-response: true

spring:
  application:
    name: secondhand-trading-platform
  # 本地私有配置（数据库密码、OSS 密钥等）从 application-local.yml 读取，该文件已被 .gitignore 忽略
  config:
    import: optional:classpath:application-local.yml
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:secondhand}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:0}
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1

# 秒杀模块配置
seckill:
  rate-limit:
    qps: 1000
  mq:
    max-retries: 3
    retry-ttl-ms: 5000

# AI 助手配置（OpenAI 兼容接口，默认 DeepSeek，可改为通义/OpenAI 等）
agent:
  base-url: https://api.deepseek.com
  api-key: 你的APIKey
  model: deepseek-chat
  max-rounds: 5

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.secondhand.entity
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${OSS_BUCKET_NAME:}

# 本地图片上传目录（未配置阿里云 OSS 时使用），映射到 /uploads/**
app:
  upload-dir: ${UPLOAD_DIR:uploads}
